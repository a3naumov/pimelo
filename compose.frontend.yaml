services:
  frontend:
    profiles: [frontend]
    container_name: ${COMPOSE_PROJECT_NAME}-frontend
    image: node:24.18.1-alpine3.24
    volumes:
      - type: bind
        source: ./src/frontend
        target: /app
    working_dir: /app
    tty: true
    user: 'node'
    networks:
      - frontend

networks:
  frontend:
    name: ${COMPOSE_PROJECT_NAME}-frontend
    driver: bridge
