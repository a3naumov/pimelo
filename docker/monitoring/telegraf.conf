[agent]
  interval = "15s"
  flush_interval = "15s"
  omit_hostname = true
  skip_processors_after_aggregators = false

[[inputs.docker]]
  endpoint = "tcp://monitoring-socket-proxy:2375"
  timeout = "5s"
  gather_services = false
  container_name_include = ["${COMPOSE_PROJECT_NAME}-*"]
  container_state_include = ["running", "restarting", "exited", "paused", "dead"]
  docker_label_include = ["com.docker.compose.project", "com.docker.compose.service"]
  tag_env = []
  perdevice_include = []
  total_include = ["cpu", "blkio", "network"]
  # Do not export host-wide engine statistics or another Compose project's data.
  namepass = ["docker_container_*"]
  [inputs.docker.tagpass]
    "com.docker.compose.project" = ["${COMPOSE_PROJECT_NAME}"]

[[processors.rename]]
  [[processors.rename.replace]]
    tag = "com.docker.compose.project"
    dest = "project"
  [[processors.rename.replace]]
    tag = "com.docker.compose.service"
    dest = "service"

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  expiration_interval = "60s"
  export_timestamp = false
