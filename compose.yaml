services:
  # Build dependency only; no runtime container is needed.
  php-roadrunner:
    profiles: [backend, notifications, media-storage, search]
    scale: 0
    network_mode: none
    build:
      context: ./docker/php-roadrunner
      target: production
    image: ${COMPOSE_PROJECT_NAME}-php-roadrunner:production

  caddy:
    profiles: [caddy]
    container_name: ${COMPOSE_PROJECT_NAME}-caddy
    image: caddy:2.11.4-alpine
    ports:
      - "${SERVICE_CADDY_PORT:-80}:80"
    volumes:
      - type: bind
        source: ./docker/caddy/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
    networks:
      - backend
      - frontend
