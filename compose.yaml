services:
  # Build dependency only; no runtime container is needed.
  php-roadrunner:
    profiles: [pim, gateway, notifications, media-storage, search]
    scale: 0
    network_mode: none
    build:
      context: ./docker/php-roadrunner
      target: production
    image: ${COMPOSE_PROJECT_NAME}-php-roadrunner:production

  caddy:
    profiles: [caddy]
    container_name: ${COMPOSE_PROJECT_NAME}-caddy
    image: caddy:2.11.4-alpine
    ports:
      - "${SERVICE_CADDY_PORT:-80}:80"
    volumes:
      - type: bind
        source: ./docker/caddy/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
    networks:
      - gateway
      - frontend

  gateway:
    profiles: [gateway]
    container_name: ${COMPOSE_PROJECT_NAME}-gateway
    build:
      context: ./docker/gateway
      target: production
      additional_contexts:
        php_roadrunner: service:php-roadrunner
    image: ${COMPOSE_PROJECT_NAME}-gateway
    volumes:
      - type: bind
        source: ./src/gateway
        target: /app
    working_dir: /app
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
    networks:
      - gateway

  kafka:
    profiles: [kafka]
    container_name: ${COMPOSE_PROJECT_NAME}-kafka
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: 1_rssB-_J7BfSpnPmRS_GA
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - type: volume
        source: kafka_data
        target: /var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - kafka

volumes:
  kafka_data:
    driver: local

networks:
  gateway:
    name: ${COMPOSE_PROJECT_NAME}-gateway
    driver: bridge
  kafka:
    name: ${COMPOSE_PROJECT_NAME}-kafka
    driver: bridge
