services:
  media-storage:
    profiles: [media-storage]
    container_name: ${COMPOSE_PROJECT_NAME}-media-storage
    build:
      context: ./docker/media-storage
      target: production
      additional_contexts:
        php_roadrunner: service:php-roadrunner
    image: ${COMPOSE_PROJECT_NAME}-media-storage
    volumes:
      - type: bind
        source: ./src/media-storage
        target: /app
    working_dir: /app
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
    networks:
      - media-storage

  minio:
    profiles: [media-storage]
    container_name: ${COMPOSE_PROJECT_NAME}-minio
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SERVICE_MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${SERVICE_MINIO_ROOT_PASSWORD:-u9!Q2v@M7r^L4x!K8p}
    volumes:
      - type: volume
        source: minio_data
        target: /data
    networks:
      - media-storage

volumes:
  minio_data:
    driver: local

networks:
  media-storage:
    name: ${COMPOSE_PROJECT_NAME}-media-storage
    driver: bridge
