name: Backend tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build backend image
        run: docker build --target dev --tag pimelo-backend-ci docker/backend

      - name: Install dependencies and run backend tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE/src/backend:/app" \
            --workdir /app \
            --env APP_ENV=test \
            --env APP_DEBUG=1 \
            --env XDEBUG_MODE=off \
            --env COMPOSER_HOME=/tmp/composer \
            pimelo-backend-ci sh -ec '
              composer install --no-interaction --prefer-dist --no-progress
              php bin/phpunit
            '
