name: Frontend checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build frontend image
        run: docker build --target dev --file docker/frontend/Dockerfile --tag pimelo-frontend-ci .

      - name: Install dependencies and run frontend checks
        run: |
          docker run --rm --init --shm-size=1gb \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE/src/frontend:/app" \
            --workdir /app \
            --env HOME=/tmp \
            --env NPM_CONFIG_CACHE=/tmp/npm-cache \
            pimelo-frontend-ci sh -ec '
              npm ci --no-audit --no-fund
              npm run check
            '

      - name: Upload browser test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-playwright-report
          path: |
            src/frontend/playwright-report/
            src/frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
