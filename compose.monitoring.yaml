x-monitoring: &monitoring
  profiles: [monitoring]
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks: [monitoring]

services:
  monitoring-grafana:
    <<: *monitoring
    container_name: ${COMPOSE_PROJECT_NAME}-monitoring-grafana
    image: grafana/grafana:13.2.3
    entrypoint:
      - /bin/sh
      - -ec
      - ': "$${GF_SECURITY_ADMIN_PASSWORD:?Set SERVICE_MONITORING_GRAFANA_ADMIN_PASSWORD in .env}"; exec /run.sh'
    environment:
      GF_SECURITY_ADMIN_USER: ${SERVICE_MONITORING_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${SERVICE_MONITORING_GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:${SERVICE_MONITORING_GRAFANA_PORT:-3000}:3000"
    volumes:
      - monitoring_grafana_data:/var/lib/grafana
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

  monitoring-prometheus:
    <<: *monitoring
    container_name: ${COMPOSE_PROJECT_NAME}-monitoring-prometheus
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${SERVICE_MONITORING_METRICS_RETENTION:-15d}
      - --storage.tsdb.retention.size=${SERVICE_MONITORING_METRICS_MAX_SIZE:-5GB}
    volumes:
      - monitoring_prometheus_data:/prometheus
      - ./docker/monitoring/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    networks: [monitoring, gateway]

  monitoring-loki:
    <<: *monitoring
    container_name: ${COMPOSE_PROJECT_NAME}-monitoring-loki
    image: grafana/loki:3.7.8
    command: [-config.file=/etc/loki/config.yaml, -config.expand-env=true]
    environment:
      LOG_RETENTION: ${SERVICE_MONITORING_LOG_RETENTION:-168h}
    volumes:
      - monitoring_loki_data:/loki
      - ./docker/monitoring/loki.yaml:/etc/loki/config.yaml:ro

  monitoring-alloy:
    <<: *monitoring
    container_name: ${COMPOSE_PROJECT_NAME}-monitoring-alloy
    image: grafana/alloy:v1.20.1
    user: alloy
    command: [run, --server.http.listen-addr=0.0.0.0:12345, --storage.path=/var/lib/alloy/data, --disable-reporting, /etc/alloy/config.alloy]
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      LOG_RETENTION: ${SERVICE_MONITORING_LOG_RETENTION:-168h}
    volumes:
      - monitoring_alloy_data:/var/lib/alloy/data
      - ./docker/monitoring/config.alloy:/etc/alloy/config.alloy:ro

  monitoring-telegraf:
    <<: *monitoring
    container_name: ${COMPOSE_PROJECT_NAME}-monitoring-telegraf
    image: telegraf:1.40.1-alpine
    # No host mounts, Docker group membership or privileged container required.
    user: telegraf
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    volumes:
      - ./docker/monitoring/telegraf.conf:/etc/telegraf/telegraf.conf:ro

  monitoring-socket-proxy:
    <<: *monitoring
    container_name: ${COMPOSE_PROJECT_NAME}-monitoring-socket-proxy
    image: wollomatic/socket-proxy:1.13.1
    # Only this small proxy can open the socket. :ro alone is NOT API authorization.
    user: "0:0"
    read_only: true
    command:
      - -listenip=0.0.0.0
      - -allowfrom=monitoring-alloy,monitoring-telegraf
      - '-allowGET=(/v[0-9]+\.[0-9]+)?/(_ping|version|info|events|networks|containers/json|containers/[a-f0-9]+/(json|logs|stats))'
      - '-allowHEAD=(/v[0-9]+\.[0-9]+)?/_ping'
      - -allowhealthcheck
      - -loglevel=warn
    volumes:
      - ${SERVICE_MONITORING_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    healthcheck:
      test: [CMD, /healthcheck]
      interval: 15s
      timeout: 5s
      retries: 3

  monitoring-postgres-exporter:
    <<: *monitoring
    container_name: ${COMPOSE_PROJECT_NAME}-monitoring-postgres-exporter
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: pimelo_monitoring
      DATA_SOURCE_PASS: ${SERVICE_MONITORING_POSTGRES_PASSWORD:-}
    networks: [monitoring, pim]

  monitoring-redis-exporter:
    <<: *monitoring
    container_name: ${COMPOSE_PROJECT_NAME}-monitoring-redis-exporter
    image: oliver006/redis_exporter:v1.93.0
    command: [--redis.addr=redis://redis:6379]
    networks: [monitoring, pim]

  monitoring-kafka-exporter:
    <<: *monitoring
    container_name: ${COMPOSE_PROJECT_NAME}-monitoring-kafka-exporter
    image: danielqsj/kafka-exporter:v1.10.0
    command: [--kafka.server=kafka:9092, --kafka.version=4.3.0]
    networks: [monitoring, kafka]

  monitoring-blackbox-exporter:
    <<: *monitoring
    container_name: ${COMPOSE_PROJECT_NAME}-monitoring-blackbox-exporter
    image: prom/blackbox-exporter:v0.28.0
    command: [--config.file=/etc/blackbox/config.yaml]
    volumes:
      - ./docker/monitoring/blackbox.yaml:/etc/blackbox/config.yaml:ro
    networks: [monitoring, gateway]

  # Utility only: run explicitly with `make monitoring-init`; never a daemon.
  monitoring-postgres-init:
    <<: *monitoring
    scale: 0
    restart: "no"
    container_name: ${COMPOSE_PROJECT_NAME}-monitoring-postgres-init
    image: postgres:18.4-alpine3.24
    entrypoint: [/bin/sh]
    command: [/etc/monitoring/init-postgres.sh]
    environment:
      PGHOST: postgres
      PGUSER: ${SERVICE_POSTGRES_USER:-dbuser}
      PGPASSWORD: ${SERVICE_POSTGRES_PASSWORD:-dbpassword}
      PGDATABASE: postgres
      PGCONNECT_TIMEOUT: "5"
      MONITORING_POSTGRES_PASSWORD: ${SERVICE_MONITORING_POSTGRES_PASSWORD:-}
      MONITORING_GRAFANA_PASSWORD: ${SERVICE_MONITORING_GRAFANA_ADMIN_PASSWORD:-}
    volumes:
      - ./docker/monitoring/check-env.sh:/etc/monitoring/check-env.sh:ro
      - ./docker/monitoring/init-postgres.sh:/etc/monitoring/init-postgres.sh:ro
    networks: [pim]

volumes:
  monitoring_grafana_data:
  monitoring_prometheus_data:
  monitoring_loki_data:
  monitoring_alloy_data:

networks:
  monitoring:
    name: ${COMPOSE_PROJECT_NAME}-monitoring
    driver: bridge
