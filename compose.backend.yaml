services:
  backend:
    profiles: [backend]
    container_name: ${COMPOSE_PROJECT_NAME}-backend
    build:
      context: ./docker/backend
      target: production
      additional_contexts:
        php_roadrunner: service:php-roadrunner
    image: ${COMPOSE_PROJECT_NAME}-backend
    volumes:
      - type: bind
        source: ./src/backend
        target: /app
    working_dir: /app
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
    depends_on:
      - postgres
      - redis
    networks:
      - backend

  postgres:
    profiles: [backend]
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_USER: ${SERVICE_POSTGRES_USER:-dbuser}
      POSTGRES_PASSWORD: ${SERVICE_POSTGRES_PASSWORD:-dbpassword}
      POSTGRES_DB: ${SERVICE_POSTGRES_DB:-appdb}
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql
    networks:
      - backend

  redis:
    profiles: [backend]
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    image: redis:8.10.0-alpine3.23
    networks:
      - backend

  kafka:
    profiles: [backend]
    container_name: ${COMPOSE_PROJECT_NAME}-kafka
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: 1_rssB-_J7BfSpnPmRS_GA
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - type: volume
        source: kafka_data
        target: /var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - backend

volumes:
  postgres_data:
    driver: local
  kafka_data:
    driver: local

networks:
  backend:
    name: ${COMPOSE_PROJECT_NAME}-backend
    driver: bridge
